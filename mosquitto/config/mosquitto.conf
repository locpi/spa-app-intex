# Configuration Mosquitto pour le spa
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Port et protocoles
listener 1883
protocol mqtt

# WebSocket pour le navigateur
listener 9001
protocol websockets

# Sécurité
allow_anonymous false
password_file /mosquitto/config/passwd

# ACL (optionnel)
acl_file /mosquitto/config/acl

# Keep alive
max_keepalive 65535

# Limites
max_connections 100
max_queued_messages 1000