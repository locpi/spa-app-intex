name: Build and Push Docker Images

on:
  push:
    branches:
      - develop


env:
  REGISTRY: registry.loicpincon.fr
  FRONTEND_IMAGE_NAME: spa-frontend
  BACKEND_IMAGE_NAME: spa-api

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app-spa-frontend
          file: ./app-spa-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: latest

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./spa-app-back
          file: ./spa-app-back/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: latest        

 