name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: registry.loicpincon.fr
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          # Copier les fichiers nécessaires
          scp -r docker-compose.prod.yml ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml
          scp -r mosquitto/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/
          scp -r postgres/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/
          scp setup-mosquitto.sh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy to production
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_PATH }}

            # Créer les répertoires nécessaires
            mkdir -p traefik mosquitto/{config,data,log} postgres/init

            # Configuration des permissions
            chmod 600 traefik/acme.json || touch traefik/acme.json && chmod 600 traefik/acme.json

            # Mise à jour des images Docker
            docker-compose pull

            # Déploiement avec zero-downtime
            docker-compose up -d --remove-orphans

            # Nettoyage des images obsolètes
            docker image prune -f

            # Vérification des services
            docker-compose ps

            echo "Déploiement terminé avec succès !"
          EOF

      - name: Health check
        run: |
          # Attendre que les services soient prêts
          sleep 30

          # Vérifier la santé des services
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Vérification des services ==="
            docker-compose ps

            echo "=== Vérification de l'API ==="
            curl -f https://spa-api.loicpincon.fr/actuator/health || echo "API Health check failed"

            echo "=== Vérification du Frontend ==="
            curl -f https://spa.loicpincon.fr || echo "Frontend check failed"

            echo "=== Logs des services ==="
            docker-compose logs --tail=20 spa-api
            docker-compose logs --tail=20 spa-frontend
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Déploiement réussi sur ${{ env.DEPLOY_HOST }}"
            echo "🌐 Frontend: https://spa.loicpincon.fr"
            echo "🔧 API: https://spa-api.loicpincon.fr"
            echo "📊 Monitoring: https://portainer.loicpincon.fr"
          else
            echo "❌ Échec du déploiement"
            exit 1
          fi

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy

    steps:
      - name: Rollback deployment
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_PATH }}

            echo "🔄 Rollback en cours..."

            # Revenir aux images précédentes (si disponibles)
            docker-compose down
            docker-compose up -d --remove-orphans

            echo "Rollback terminé"
          EOF